services:
  # MongoDB Database with Single-Node Replica Set for Transaction Support
  mongodb:
    image: mongo:7.0
    container_name: abp-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: academic-booking-portal
    volumes:
      - mongodb_data:/data/db
    networks:
      - abp-network
    healthcheck:
      test: mongosh --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  # Node.js + Express Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: abp-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/academic-booking-portal?replicaSet=rs0&directConnection=true
      JWT_SECRET: super_secret_production_jwt_key_32chars_minimum
      CLIENT_URL: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - abp-network

  # FastAPI AI Sidecar Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: abp-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      EXPRESS_SERVER_URL: http://server:5000
    networks:
      - abp-network

  # React + Vite Frontend Client (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: abp-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - abp-network

volumes:
  mongodb_data:
    driver: local

networks:
  abp-network:
    driver: bridge
